spring.application.name=practicum

# Lahat ng secret ay galing sa environment variables (IDE run config sa laptop, .env sa server)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practicum_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
# Nasa likod ng Caddy: kunin ang totoong IP ng user mula sa X-Forwarded-For (para sa rate limit ng public na form).
# Ang Tomcat RemoteIpValve ay nagtitiwala lang sa header kapag galing sa private/internal na IP (hal. Docker network).
server.forward-headers-strategy=native

# Kill switch ng service worker (offline mode). false = aalisin ng app ang service worker at cache ng app.
app.client.service-worker-enabled=${APP_SW_ENABLED:true}

# JWT (dev default lang ito. Sa production, JWT_SECRET ang gagamitin mula sa .env)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.upload-dir=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

app.s3.bucket=practicum-uploads-bucket
app.s3.region=ap-southeast-1

# Local dev lang: kung may laman, sa folder na ito isi-save ang mga file ng student (hindi sa S3)
app.storage.local-dir=${STORAGE_LOCAL_DIR:}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# Email (verification ng registration at forgot password).
# MAIL_PROVIDER=ses para sa AWS SES; walang laman o "log" = ipinapakita lang sa console ang email at link (local dev).
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:OJT System}
app.mail.reply-to=${MAIL_REPLY_TO:}
app.mail.ses-region=${MAIL_SES_REGION:ap-southeast-1}
app.mail.ses-configuration-set=${MAIL_SES_CONFIGURATION_SET:}
# Address ng web app (frontend) para sa mga link sa email. Sa production: https://practicum-app-cite.com
app.web-url=${APP_WEB_URL:http://localhost:5173}

# Privacy Notice (RA 10173). Palitan ang mga placeholder sa production gamit ang env vars.
# Itaas ang notice-version kapag binago ang teksto ng notice; tatanungin ulit ang mga student.
app.privacy.dpo-name=${PRIVACY_DPO_NAME:[DPO NAME - TO BE FILLED]}
app.privacy.dpo-email=${PRIVACY_DPO_EMAIL:[DPO EMAIL - TO BE FILLED]}
app.privacy.retention=${PRIVACY_RETENTION:[RETENTION PERIOD - TO BE FILLED]}
app.privacy.notice-version=${PRIVACY_NOTICE_VERSION:2026-11}
