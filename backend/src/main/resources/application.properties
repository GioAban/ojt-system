spring.application.name=practicum

# Lahat ng secret ay galing sa environment variables (IDE run config sa laptop, .env sa server)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practicum_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# JWT (dev default lang ito. Sa production, JWT_SECRET ang gagamitin mula sa .env)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.upload-dir=uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

app.s3.bucket=practicum-uploads-bucket
app.s3.region=ap-southeast-1
